<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your CareerPath AI student account.">
  <title>Login | CareerPath AI</title>
</head>
<body class="page">
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <a class="auth-logo" href="../index.html"><img class="auth-logo-image" src="../assets/images/logo.png" alt="CareerPath AI logo"> <span class="auth-logo-text">CareerPath AI</span></a>
      <h1 class="auth-title" id="login-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue your career journey and see your latest recommendations.</p>
      <form class="auth-form login-form" action="dashboard.html" method="get">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-input" type="email" id="login-email" name="email" placeholder="you@university.edu" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="form-row form-row-between">
          <div class="form-check">
            <input class="form-checkbox" type="checkbox" id="remember-me" name="remember">
            <label class="form-check-label" for="remember-me">Remember me</label>
          </div>
          <a class="form-link forgot-password-link" href="#forgot-password">Forgot password?</a>
        </div>
        <button class="button button-primary button-block" type="submit">Log In</button>
      </form>
      <p class="auth-divider"><span>or</span></p>
      <button class="button button-google button-block" type="button"><img class="button-icon" src="../assets/icons/google.svg" alt=""> Continue with Google</button>
      <p class="auth-switch">Don't have an account? <a class="form-link" href="register.html">Create one</a></p>
      <p class="auth-back"><a class="form-link" href="../index.html">Back to Home</a></p>
    </section>
  </main>
</body>
</html>
